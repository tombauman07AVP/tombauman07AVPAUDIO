<!doctype html><html lang="en"><head><meta charset=utf8><meta name="robots" content="noindex,nofollow"><meta name="description" content="Ballroom audio system notes. Staff sign-in required."><meta name="theme-color" content="#060A14"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Ballroom Audio"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Royal Pines Ballroom Audio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style id="css">
/* Layout: the full-screen star map IS the page. Drag or pinch to travel between sectors; details open in a glass panel on the right (a bottom sheet on phones); a small dock flies the camera. Single deliberate dark "space" look. */
:root{
  color-scheme:dark;
  --space:#060A14;--ink:#E6ECF7;--muted:#8E9DBA;--line:rgba(142,162,198,.18);--line-strong:rgba(142,162,198,.34);
  --glass:rgba(11,17,33,.86);--glass-2:rgba(255,255,255,.035);--glass-3:rgba(255,255,255,.08);
  --accent:#86B6FF;--on-accent:#06101F;--wire:#8FA2C4;--shadow:rgba(0,0,0,.55);
  --ql:#FF9F5A;--ql-bg:rgba(255,159,90,.12);--rio:#76ABFF;--rio-bg:rgba(118,171,255,.12);--gal:#93E27F;--gal-bg:rgba(147,226,127,.11);
  --spk:#C99DFF;--spk-bg:rgba(201,157,255,.12);--room:#B3C0D6;--room-bg:rgba(179,192,214,.09);--dante:#6FD8EC;--dante-bg:rgba(111,216,236,.10);
  --ok:#6EE7A8;--ok-bg:rgba(110,231,168,.14);--warn:#FFC766;--warn-bg:rgba(255,199,102,.14);--strip:rgba(255,255,255,.06);
  --f-display:"Chakra Petch","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:radial-gradient(1100px 760px at 14% 18%,rgba(98,74,205,.20),transparent 62%),radial-gradient(1000px 720px at 86% 82%,rgba(28,150,182,.16),transparent 60%),var(--space);color:var(--ink);font:400 15px/1.5 var(--f-body);overflow:hidden}
a{color:var(--accent)}
button{font-family:inherit}
.k-ql{--k:var(--ql);--kb:var(--ql-bg)}.k-rio{--k:var(--rio);--kb:var(--rio-bg)}.k-gal{--k:var(--gal);--kb:var(--gal-bg)}
.k-spk{--k:var(--spk);--kb:var(--spk-bg)}.k-room{--k:var(--room);--kb:var(--room-bg)}.k-dante{--k:var(--dante);--kb:var(--dante-bg)}
.scene{position:fixed;inset:0;overflow:hidden;overflow:clip}
#stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.viewport{position:absolute;inset:0;cursor:grab;touch-action:none;outline:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.viewport *{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.viewport.dragging .world{pointer-events:none}
.viewport.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.area{position:absolute}
.atitle{font:700 13px var(--f-display);letter-spacing:.32em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.atitle b{color:var(--ink);font-weight:700}
.asub{font-size:14px;color:var(--muted);margin-top:4px}
/* topology */
.sys svg{display:block;overflow:visible}
.node{cursor:pointer;transition:opacity .2s}
.node rect{fill:var(--kb);stroke:var(--k);stroke-width:1.6;transition:stroke-width .15s,fill .15s}
.node.planned rect{stroke-dasharray:7 5}
.node.main rect{stroke-width:2.6}
.node.main .nt{font-size:17px}
svg.routing .node.main.ron rect{stroke-width:3.4}
.node .nt{font:700 15px var(--f-display);fill:var(--k);letter-spacing:.08em}
.node .ns{font:500 12.5px var(--f-body);fill:var(--ink)}
.node .nm{font:600 10.5px var(--f-display);fill:var(--muted);letter-spacing:.12em}
.node:hover rect,.node.on rect{stroke-width:2.6}
.node:focus{outline:none}
.node:focus-visible rect{stroke-width:3.5;stroke:var(--ink)}
.hdr{font:700 11px var(--f-display);fill:var(--muted);letter-spacing:.26em}
.e{fill:none;stroke:var(--wire);stroke-width:1.6;opacity:.55;transition:opacity .2s}
.e.dn{stroke:var(--dante)}.e.sp{stroke:var(--spk)}.e.planned{stroke-dasharray:6 5}
.flow{fill:none;stroke:#FFFFFF;stroke-width:2;stroke-linecap:round;stroke-dasharray:2 18;opacity:.8;animation:flow 1.6s linear infinite}
.flow.dn{stroke:var(--dante);animation-duration:2.6s}.flow.sp{stroke:var(--spk)}
@keyframes flow{to{stroke-dashoffset:-40}}
.mk{fill:var(--wire)}.mk-d{fill:var(--dante)}.mk-s{fill:var(--spk)}
.elab{font:500 10.5px var(--f-body);fill:var(--muted);transition:opacity .2s}
.dline .dhalo{fill:none;stroke:#070B16;stroke-width:8;stroke-linecap:round}
.dline .dglow{fill:none;stroke:var(--dante);stroke-width:7;opacity:.14;stroke-linecap:round;transition:opacity .2s}
.dline .dl{fill:none;stroke:var(--dante);stroke-width:2.2;stroke-linecap:round;transition:stroke-width .15s}
.dline .dhit{fill:none;stroke:transparent;stroke-width:18}
.dline:hover .dl,.dline.on .dl{stroke-width:3.2}
.dline:focus-visible .dl{stroke:var(--ink);stroke-width:3.5}
svg.routing .dline.ron .dl{stroke-width:3.4}
svg.routing .dline.ron .dglow{opacity:.4}
.dlab{font:700 11px var(--f-display);fill:var(--dante);letter-spacing:.24em}
.node .nt.sm{font-size:12.5px;letter-spacing:.06em}
.node .ns.sm{font-size:11px;fill:var(--muted)}
.zone{cursor:pointer}
.zone rect{fill:rgba(179,192,214,.035);stroke:var(--line-strong);stroke-width:1.2;stroke-dasharray:5 6;transition:stroke .15s,fill .15s}
.zone:hover rect,.zone:focus-visible rect{stroke:var(--room);fill:rgba(179,192,214,.06)}
.zone:focus{outline:none}
.zone .wall{stroke:var(--room);stroke-width:3;opacity:.55}
.zone .zn{font:700 30px var(--f-display);letter-spacing:.32em;fill:rgba(230,236,247,.14);pointer-events:none}
.zone .zs{font:600 12px var(--f-display);letter-spacing:.3em;fill:rgba(142,157,186,.45);pointer-events:none}
.foyerz .zn{font-size:20px}
.av2 rect{fill:rgba(118,171,255,.045);stroke:rgba(118,171,255,.45);stroke-width:1.4}
.av2t{font:700 14px var(--f-display);letter-spacing:.3em;fill:var(--rio)}
.halo{fill:none;stroke:#070B16;stroke-width:7;stroke-linecap:round}
.node rect.nbg{fill:#070B16;stroke:none!important}
svg.routing .zone,svg.focus .zone{opacity:.55}
.legend i.p{border-top-style:dashed;border-color:var(--spk)}
svg.focus .e:not(.on),svg.focus .flow:not(.on){opacity:.08}
svg.focus .node:not(.on){opacity:.3}
svg.focus .elab{opacity:.2}
/* sign-in screen, account and admin */
.gate{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(6,10,20,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow:auto}
.gatecard{box-sizing:border-box;width:min(400px,100%);border-radius:18px;padding:26px 24px 22px;border-color:var(--line-strong);box-shadow:0 24px 70px var(--shadow)}
.gbrand{display:grid;line-height:1.15}
.gbrand small{font:700 10.5px var(--f-display);letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.gbrand b{font:700 21px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.gate h2{font:700 19px var(--f-display);letter-spacing:.06em;margin:20px 0 4px}
.gate label{display:block;font:600 11px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.gate input{box-sizing:border-box;width:100%;font:500 16px var(--f-body);padding:11px 12px;border-radius:10px;border:1px solid var(--line-strong);background:rgba(0,0,0,.3);color:var(--ink)}
.gate input:focus{outline:2px solid var(--accent);outline-offset:1px}
.gate .btn.primary{width:100%;margin-top:20px;padding:11px;font-size:15px}
.grow{display:flex;gap:8px;margin-top:18px}.grow .btn,.gate .grow .btn.primary{flex:1;width:auto;margin-top:0;padding:10px}
.gmsg{min-height:1.4em;margin:12px 0 0;font-size:14px;color:var(--warn)}
.gnote{font-size:13.5px;color:var(--muted);margin:12px 0 0}
.ubtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:700 12.5px var(--f-display);letter-spacing:.04em;text-decoration:none;flex:none}
.ubtn:hover{outline:2px solid var(--ink);outline-offset:1px}
.frow{display:flex;gap:8px;flex-wrap:wrap}.frow .fi{flex:1 1 220px;width:auto;font-size:15px;padding:8px 10px}
.fgrid{display:grid;gap:8px;max-width:420px}.fgrid .fi{font-size:15px;padding:8px 10px}
.adminbody{margin-top:14px}
.afil{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.afil select.fi{width:auto;font-size:14px;padding:6px 8px}
.alog td.when{white-space:nowrap;font-size:13px}.alog td.when small{display:block;color:var(--muted);font-size:12px}
.alog td.who{font-weight:600;white-space:nowrap}
.sumd{margin-top:4px}.sumd summary{cursor:pointer;color:var(--accent);font-size:13px}
.sumd pre{white-space:pre-wrap;font:500 12.5px/1.5 var(--f-mono);color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0 0;max-height:260px;overflow:auto}
.ainfo{padding:14px 16px;font-size:14px}.ainfo ol{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.people .prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.people .prow:last-child{border-bottom:0}
.pwho{display:grid;min-width:0}.pwho b,.pwho .dim{overflow-wrap:anywhere}
.prow select.fi{width:auto;font-size:14px;padding:6px 8px}
.preset{grid-column:1/-1;display:flex;gap:8px}.preset .fi{flex:1;font-size:14px;padding:6px 8px;width:auto;min-width:0}
.versions .vrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.versions .vrow:last-child{border-bottom:0}
#imp-file{font:500 14px var(--f-body);color:var(--muted);max-width:100%}
#imp-file::file-selector-button{font:600 13.5px var(--f-body);border:1px solid var(--line-strong);background:var(--glass-2);color:var(--ink);padding:6px 13px;border-radius:9px;cursor:pointer;margin-right:10px}
/* route highlight on the map */
svg.routing .node{opacity:.2}
svg.routing .node.ron{opacity:1}
svg.routing .node.ron rect{stroke-width:3}
svg.routing .e{opacity:.06}
svg.routing .e.ron{opacity:1;stroke-width:2.6}
svg.routing .flow{opacity:0}
svg.routing .flow.ron{opacity:1;stroke-width:3;animation-duration:1.1s}
svg.routing .flow.ron.rev{animation-direction:reverse}
svg.routing .elab{opacity:.25}
svg.routing .halo{opacity:0}
svg.routing .halo.ron{opacity:1}
.rchip{top:calc(70px + env(safe-area-inset-top,0px));left:14px;border-radius:12px;padding:5px 5px 5px 12px;display:flex;align-items:center;gap:10px;max-width:min(460px,calc(100% - 28px));font-size:14px}
.rchip .live{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 10px var(--accent)}
.rchip small{font:700 10px var(--f-display);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.rchip a{color:var(--ink);font-weight:600;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rchip a:hover{text-decoration:underline}
.rchip .x{width:30px;height:30px;font-size:15px;flex:none}
/* signal finder */
.readas{margin:12px 0 0;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rd{font:600 12.5px var(--f-body);color:var(--ink);background:var(--glass-3);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.rd.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.readas .ign{font-size:12.5px;margin-left:4px}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.best{margin-top:14px;padding:16px 18px 14px;border-top:3px solid var(--accent)}
.bhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.btitle{font:700 21px/1.15 var(--f-display);letter-spacing:.05em;margin:3px 0 0}
.bsub{font-size:13.5px;color:var(--muted);margin-top:2px}
.flowv{list-style:none;margin:14px 0 0;padding:0;position:relative}
.flowv::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;border-left:2px dashed var(--line-strong)}
.flowv::after{content:"";position:absolute;left:5px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px 2px rgba(134,182,255,.6);animation:drip 2.8s cubic-bezier(.45,0,.55,1) infinite}
@keyframes drip{0%{top:10px;opacity:0}8%{opacity:1}90%{opacity:1}100%{top:calc(100% - 18px);opacity:0}}
.fstep{position:relative;display:grid;grid-template-columns:18px minmax(0,1fr);gap:12px;padding:7px 0}
.fdot{width:14px;height:14px;border-radius:50%;border:2px solid var(--k);background:#0B1121;margin-top:2px;position:relative;z-index:1;box-shadow:0 0 0 3px var(--kb)}
.fnode{font:700 11px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--k);text-decoration:none}
a.fnode:hover{text-decoration:underline}
.fvals{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.lv{display:inline-flex;align-items:baseline;gap:7px;padding:3px 10px;border-radius:7px;background:var(--kb);border:1px solid var(--line);border-color:color-mix(in srgb,var(--k) 35%,transparent);font:600 14px var(--f-body)}
.lv i{font:700 10px var(--f-display);font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lv{max-width:100%;box-sizing:border-box}
.cval{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:3px 6px;min-width:0}
.cnum{font-weight:500;color:var(--muted);font-size:.93em}
.carr{color:var(--muted);margin:0 1px}
.chip .cnmc{font:700 12.5px var(--f-display);letter-spacing:.04em;white-space:nowrap}
.chip .cnmc + .cv{font-weight:500;color:var(--muted);font-size:12px}
.chres{margin-top:14px;padding:12px 14px 8px;border-top:3px solid var(--ql)}
.chh{font:700 13px var(--f-display);letter-spacing:.16em;text-transform:uppercase;margin:0 0 6px;display:flex;justify-content:space-between;gap:10px}
.chh small{font:500 13px var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted)}
.chrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:9px 6px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);border-radius:6px}
.chrow:hover{background:var(--glass-2)}
.chdev{font:700 10.5px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--k)}
.chch{font:600 14px var(--f-body)}
.chrow .cnm{margin-left:0}
.chft{flex-basis:100%;font-size:13px;color:var(--muted)}
.cnm{display:inline-block;font:600 11.5px/1.5 var(--f-display);letter-spacing:.05em;color:var(--ink);background:rgba(255,255,255,.09);border:1px solid var(--line-strong);border-radius:4px;padding:0 6px;margin:0;white-space:nowrap;vertical-align:1px;font-size:12.5px}
.checks{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.checks summary{cursor:pointer;font:700 13px var(--f-display);letter-spacing:.16em;text-transform:uppercase;list-style:none;display:flex;align-items:center;gap:8px}
.checks summary::-webkit-details-marker{display:none}
.checks summary::before{content:"\25B8";color:var(--muted);transition:transform .15s}
.checks[open] summary::before{transform:rotate(90deg)}
.checks summary small{font:500 13px var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted)}
.clist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.clist label{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;padding:7px 8px;border-radius:8px;cursor:pointer}
.clist label:hover{background:var(--glass-2)}
.clist input{width:17px;height:17px;margin:2px 0 0;accent-color:var(--ok)}
.clist b{font-weight:600}
.clist input:checked + span{color:var(--muted);text-decoration:line-through}
.tip{font-size:13.5px;color:var(--muted);margin:10px 0 0;padding-left:10px;border-left:2px solid var(--accent)}
.tip.warn{border-color:var(--warn);color:var(--ink)}
.near{margin:14px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.near>span{margin-right:2px}
.fstep.ok .fdot{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.fstep.ok .fdot::after{content:"";position:absolute;left:3px;top:0;width:3px;height:6px;border:solid #06101F;border-width:0 2px 2px 0;transform:rotate(45deg)}
.clist li.next label{background:rgba(134,182,255,.08);box-shadow:inset 3px 0 0 var(--accent)}
.tip.done{border-color:var(--ok);color:var(--ink)}
.chint{font-size:13px;color:var(--muted);margin:8px 0 0}
.crow{display:flex;align-items:flex-start;gap:6px}
.crow label{flex:1;min-width:0}
.stk{flex:none;margin-top:5px;font:600 12px var(--f-body);color:var(--muted);background:transparent;border:1px solid var(--line-strong);border-radius:999px;padding:3px 11px;cursor:pointer;white-space:nowrap}
.stk:hover{color:var(--ink);border-color:var(--warn)}
.clist li.next .stk{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.clist li.stuck .stk{background:var(--warn-bg);color:var(--ink);border-color:var(--warn)}
.clist li.done .stk{visibility:hidden}
.clist li.stuck label{background:var(--warn-bg);box-shadow:inset 3px 0 0 var(--warn)}
.why{margin:4px 0 12px 30px;padding:12px 14px 14px;border-radius:10px;background:var(--glass-2);border:1px solid var(--line);border-left:3px solid var(--warn);font-size:14px;line-height:1.5}
.why .wh{margin:0 0 6px;font:700 11.5px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.why * + .wh{margin-top:14px}
.wpath{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 12px;margin:0;align-items:baseline}
.wpath dt{font-size:12.5px;color:var(--muted);white-space:nowrap}
.wpath dd{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;min-width:0}
.wpath dd b{font-weight:600}
.wpath dd small{color:var(--muted);font-size:12px}
.wpath dd small::before{content:"· "}
.wpath .wl{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px;min-width:0}
.wpath .wl + .wl{padding-left:8px;border-left:1px solid var(--line)}
.wpath .wl i{font:600 11px var(--f-display);font-style:normal;letter-spacing:.06em;color:var(--muted)}
.wpath .wv{color:var(--ink)}
.brk{margin:12px 0 0;padding:9px 11px;border-radius:8px;background:var(--warn-bg)}
.brk.first{background:var(--glass-3)}
.brk .bok,.brk .bnone{display:none}
.brk.pok .bok,.brk.pnone .bnone{display:inline}
.brk.pok .bnot,.brk.pnone .bnot{display:none}
.brk .bok{font-weight:600}
.wwhy{margin:12px 0 0}
.wwhy b{font-weight:600}
.wlook{margin:0;padding-left:18px;display:grid;gap:4px}
.wchips{margin-top:10px}
.wact{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.wact .btn{display:inline-flex;align-items:center;justify-content:center}
.wact a.btn{text-decoration:none}
.fstep.bad .fdot{background:var(--warn);border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
@media (max-width:560px){.why{margin-left:0;padding:12px}.wpath{grid-template-columns:1fr;gap:2px}.wpath dd + dt{margin-top:8px}}

function rfSvg(){
  var s = cur(), n = s.rf.length, W = 1080, H = 560, cx = W/2, cy = 300, rx = 400, ry = 190;

  o.push('<ellipse class="orbit" cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'"/>');
  o.push('<circle class="hub" cx="'+cx+'" cy="'+cy+'" r="62" filter="url(#glow)"/><text class="big" x="'+cx+'" y="'+(cy+6)+'" text-anchor="middle">'+total+'</text><text class="lab" x="'+cx+'" y="'+(cy+28)+'" text-anchor="middle">CHANNELS</text>');
  s.rf.forEach(function(r,i){
    var a = -Math.PI/2 + i*2*Math.PI/n, x = cx + rx*Math.cos(a), y = cy + ry*Math.sin(a), rad = 9 + (Number(r.ch)||0)*2.1;

/* ---------- events: each event's details plus its routing, saved to the site for the techs ---------- */
var EVD = null, EVDIRTY = false, EVSAVING = false, EVARM = "", EVARMT = null, EV_STASH = "ballroomEventDraft";

var EV_DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], EV_MONS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function evId(){ return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function evStr(v, n){ return String(v == null ? "" : v).slice(0, n); }

    times: times, notes: evStr(o.notes, 4000), plan: plan,

}
function evAll(){ var e = cur().events; return e && typeof e === "object" && !Array.isArray(e) ? e : {}; }
function evGet(id){ var e = evAll()[id]; return e && typeof e === "object" ? evNorm(Object.assign({}, e, {id:id})) : null; }
function evToday(){ var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth()+1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function evDate(s, year){
  if (!s) return "";
  var p = s.split("-"), d = new Date(+p[0], +p[1]-1, +p[2]);
  return EV_DAYS[d.getDay()] + " " + d.getDate() + " " + EV_MONS[d.getMonth()] + (year || +p[0] !== new Date().getFullYear() ? " " + p[0] : "");
}
function evTime(s){ if (!s) return ""; var h = +s.slice(0,2); return (h % 12 || 12) + ":" + s.slice(3) + (h < 12 ? "am" : "pm"); }
function evWhen(iso){ var d = new Date(iso); if (isNaN(d)) return ""; var h = d.getHours(); return EV_DAYS[d.getDay()] + " " + d.getDate() + " " + EV_MONS[d.getMonth()] + " " + d.getFullYear() + ", " + (h % 12 || 12) + ":" + ("0" + d.getMinutes()).slice(-2) + (h < 12 ? "am" : "pm"); }
function evRooms(e){ return plDesks(e.plan).map(function(d){ return PL_DESKS[d].name + " " + plRoomList(plRoomsOf(e.plan, d)); }).join(" · "); }

/* the unsaved draft is kept on this device, so a reload or a closed tab doesn't lose it */

/* saving: the event goes into the site data, like any other edit */
function evPush(id, ev, summary, retried){
  var next = bare(state); next.events = Object.assign({}, next.events || {});

  return sb.rpc("save_site", {p_state: next, p_expected: state.version, p_summary: summary}).then(function(res){
    state = next; state.version = res.version; state.savedAt = res.updated_at; state.updatedBy = res.updated_by_name; return res;
  }, function(err){
    if (!retried && err && (err.status === 409 || /conflict/i.test(err.message || ""))) return refetchSite().then(function(){ return evPush(id, ev, summary, true); });   // someone saved in between: put this one event on top of theirs
    throw err;
  });
}
function evCommit(id, ev, summary){
  if (editing && dirty){ toast("Save or discard your page edits first."); return Promise.reject(null); }
  if (editing){ editing = false; draft = null; }
  if (!CLOUD){   // the self-saving copy: same edit, saved the normal way (the page reloads)
    try{ localStorage.removeItem(EV_STASH); }catch(e){}
    draft = clone(state); draft.events = Object.assign({}, draft.events || {}); if (ev) draft.events[id] = ev; else delete draft.events[id];
    editing = true; editBase = clone(state); dirty = true; save();
    return new Promise(function(){});
  }
  EVSAVING = true; evBar();
  return evPush(id, ev, summary, false).then(function(r){ EVSAVING = false; return r; }, function(err){
    EVSAVING = false; evBar();
    if (err && err.status === 403) toast("You don’t have permission to edit.");
    else if (!err || err.status !== 401) toast("Couldn’t save the event just now. Try again in a moment.");
    throw err;
  });
}

  ev.createdAt = ev.createdAt || now; ev.updatedAt = now; ev.updatedBy = (me && (me.name || me.email)) || "";
  evCommit(ev.id, ev, (isNew ? "Event added: " : "Event changed: ") + "“" + ev.name + "”" + (ev.date ? " (" + evDate(ev.date, true) + ")" : "")).then(function(){
    evDrop(); toast(isNew ? "Event saved." : "Event updated."); location.hash = "event-" + ev.id;

  if (t.hasAttribute("data-restore")){
    var v = Number(t.getAttribute("data-restore"));
    if (restoreArm !== v){ restoreArm = v; renderAdmin(); setTimeout(function(){ if (restoreArm === v){ restoreArm = null; renderAdmin(); } }, 5000); return true; }
    restoreArm = null; t.disabled = true;
    sb.rpc("restore_version", {p_version: v}).then(function(){ return refetchSite(); }).then(function(){ adminCache = {}; refreshAll(); toast("Version " + v + " is back."); })
      .catch(function(e){ toast(e.message || "Couldn’t restore."); });
    return true;
  }
  return false;
}
function adminChange(t){
  var id = t.getAttribute("data-role-for");
  if (id){
    var role = t.value;
    sb.rpc("set_role", {p_user: id, p_role: role}).then(function(){ toast("Access updated."); delete adminCache.activity; if (me && id===me.id){ me.role = role; renderHud(); } loadAdmin(true); })
      .catch(function(e){ toast(e.message || "Couldn’t change that."); loadAdmin(true); });
    return true;
  }
  if (t.id === "imp-file"){ readImport(t); return true; }
  if (t.id === "af-who"){ adminFilter.who = t.value; renderAdmin(); return true; }
  if (t.id === "af-what"){ adminFilter.what = t.value; renderAdmin(); return true; }
  return false;
}
function accountClick(t){
  if (t.id === "signout"){ doSignOut(); return true; }
  if (t.id === "acc-savename"){
    var n = ($("acc-name").value || "").trim(); if (!n){ toast("Enter a name."); return true; }
    sb.rpc("set_name", {p_user: me.id, p_name: n}).then(function(){ me.name = n; toast("Name saved."); renderHud(); }).catch(function(e){ toast(e.message || "Couldn’t save."); });
    return true;
  }
  if (t.id === "acc-savepw"){
    var a = $("acc-pw1").value, b = $("acc-pw2").value, m = $("acc-msg");
    if (a.length < 8){ m.textContent = "Use at least 8 characters."; return true; }
    if (a !== b){ m.textContent = "The two passwords don’t match."; return true; }
    t.disabled = true; m.textContent = "Saving…";
    sb.setPassword(a).then(function(){ $("acc-pw1").value = ""; $("acc-pw2").value = ""; m.textContent = "Password changed."; logEvent("password_changed"); })
      .catch(function(e){ m.textContent = e.status === 422 ? "Pick a different password (it may be too weak or the same as before)." : "Couldn’t change it (" + e.message + ")."; })
      .then(function(){ t.disabled = false; });
    return true;
  }
  return false;
}

/* ---------- boot ---------- */
function startApp(){
  started = true;
  renderWorld();
  var rp0 = routeParts(); if (rp0.base==="signals" && rp0.q.q != null) sigFilter.q = rp0.q.q;
  var r = resolve(route()); renderHud(); renderDrawer(r); afterDrawer(); applyRowHL();
  var keep = REDUCE; REDUCE = true; flyTo(r.rect || AREA.system, r.view ? 1.3 : 1.15); REDUCE = keep; lastRoute = route();
  logView();
}
document.title = TITLE;
if (CLOUD){ drawStars(); cloudBoot(); }
else {
  try{ var pd = sessionStorage.getItem("pendingDraft"); if (pd){ pd = JSON.parse(pd); if (pd.savedAt === state.savedAt) sessionStorage.removeItem("pendingDraft"); else pending = pd; } }catch(e){}
  startApp();
  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(a){ if (a){ api = a; renderHud(); } }).catch(function(){});
  }
}
})();
</script>
